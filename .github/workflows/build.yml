name: Build OmniTune EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Build portable EXE with PyInstaller
        run: pyinstaller omniture.spec --noconfirm --clean

      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniTune-${{ github.ref_name }}
          path: dist/OmniTune.exe

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OmniTune.exe
          generate_release_notes: true
